<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="910" height="569" viewBox="-50 -86 910 569" id="automaton-svg" version="1.1">
    <!-- Solid technical blueprint paper ground -->
    <rect x="-50" y="-86" width="910" height="569" fill="#f8f9fa" />
    <!-- Fine 20px grid lines for technical blueprint look -->
    <defs>
      <pattern id="export-grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.75" />
      </pattern>
    </defs>
    <rect x="-50" y="-86" width="910" height="569" fill="url(#export-grid)" opacity="0.6" />
    
    
    <!-- Blueprint Header -->
    <g id="export-header-group">
      <rect x="-34" y="-74" width="878" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="-22" y="-54" font-size="12" font-weight="700" fill="#1e293b">
        Minimized DFA for (01)*101
      </text>
      <text x="832" y="-54" font-size="11" font-weight="500" fill="#475569" text-anchor="end">
        6 states · 12 transitions · AutoMind-AI
      </text>
    </g>
    
  <defs>
    <style type="text/css">
      <![CDATA[
        text {
          font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
          text-rendering: geometricPrecision;
          -webkit-font-smoothing: antialiased;
        }
        .svg-edge-path {
          fill: none;
          stroke: #1e293b;
          stroke-width: 1.8px;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .svg-edge-path.active {
          stroke: #d97706;
          stroke-width: 3.2px;
        }
        .svg-edge-label-bg {
          fill: #ffffff;
          stroke: #cbd5e1;
          stroke-width: 1px;
          rx: 3px;
        }
        .svg-edge-label-text {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 600;
          fill: #1e293b;
          text-anchor: middle;
          dominant-baseline: central;
        }
        .svg-state-circle {
          fill: #ffffff;
          stroke: #1e293b;
          stroke-width: 2px;
        }
        .svg-state-group.active .svg-state-circle {
          stroke: #d97706;
          stroke-width: 3px;
          fill: #fef3c7;
        }
        .svg-state-circle.accepting-outer {
          fill: none;
          stroke: #1e293b;
          stroke-width: 1.5px;
        }
        .svg-state-group.active .accepting-outer {
          stroke: #d97706;
        }
        .svg-state-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          font-weight: 700;
          fill: #1e293b;
          text-anchor: middle;
          dominant-baseline: central;
        }
        .svg-start-arrow path {
          stroke: #1e293b;
          stroke-width: 2px;
        }
      ]]>
    </style>
